<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym AI Assistant</title>
    
    <!-- Configuración para iPhone (PWA a pantalla completa) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GymAI">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/512/ffffff/dumbbell.png">

    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --accent-color: #0a84ff;
            --text-color: #ffffff;
            --text-secondary: #8e8e93;
            --success-color: #30d158;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            padding-bottom: 50px;
        }

        /* Pantalla de Login */
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 85vh;
            text-align: center;
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #2c2c2e;
            border: 1px solid #38383a;
            border-radius: 10px;
            color: var(--text-color);
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:active {
            opacity: 0.8;
        }

        .error-msg {
            color: #ff453a;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* App Principal (Oculta hasta hacer login) */
        #app-screen {
            display: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .date-title {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .card p {
            font-size: 15px;
            color: #d1d1d6;
            line-height: 1.4;
        }

        /* Check Creatina */
        .creatine-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .checkbox-container input {
            width: 22px;
            height: 22px;
            accent-color: var(--success-color);
            cursor: pointer;
            margin-bottom: 0;
        }

        /* Caja de entrada de voz/texto */
        .input-section textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            background-color: #2c2c2e;
            border: 1px solid #38383a;
            border-radius: 10px;
            color: var(--text-color);
            font-size: 15px;
            resize: none;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen">
        <div class="login-card">
            <h1>GymAI 🏋️‍♂️</h1>
            <input type="text" id="username" placeholder="Usuario (subnormal)" autocapitalize="none">
            <input type="password" id="password" placeholder="Contraseña">
            <button onclick="handleLogin()">Entrar</button>
            <div id="error-msg" class="error-msg">Usuario o contraseña incorrectos</div>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="app-screen">
        <div class="header">
            <div>
                <div class="date-title" id="current-date">CARGANDO FECHA...</div>
                <h1 style="margin-bottom:0;">Hola máquina </h1>
            </div>
            <button onclick="handleLogout()" style="width: auto; padding: 6px 12px; font-size: 12px; background-color: #3a3a3c;">Salir</button>
        </div>

        <!-- Dashboard: Creatina -->
        <div class="card creatine-box">
            <div>
                <h2>Creatina</h2>
                <p style="font-size: 13px; color: var(--text-secondary);">Regístrala hoy</p>
            </div>
            <label class="checkbox-container">
                <input type="checkbox" id="creatine-check" onclick="toggleCreatine()">
                <span id="creatine-status-text" style="color: var(--text-secondary);">Pendiente</span>
            </label>
        </div>

        <!-- Dashboard: Rutina de hoy -->
        <div class="card">
            <h2>📅 Rutina de Hoy</h2>
            <p id="today-routine">Cargando planificación del día...</p>
        </div>

        <!-- Dashboard: Comida asignada -->
        <div class="card">
            <h2>🍽️ Plan Nutricional</h2>
            <p id="today-meal">Cargando menú del día...</p>
        </div>

        <!-- Módulo de Entrada (Texto / IA futura) -->
        <div class="card">
            <h2>🎙️ Registrar Entreno o Comida</h2>
            <div class="input-section">
                <textarea id="ai-input" placeholder="Ej: He hecho 4 series de press banca con 80kg, o sube foto de tu plato..."></textarea>
                <button onclick="sendDataToN8n()">Enviar a n8n (Próximamente)</button>
            </div>
        </div>
    </div>

    <script>
        // Comprobar si ya estaba logueado
        window.onload = function() {
            if (localStorage.getItem("gym_logged_in") === "true") {
                showApp();
            }
            loadDate();
        }

        function handleLogin() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const errorDiv = document.getElementById("error-msg");

            if (user === "alex" && pass === "1432") {
                localStorage.setItem("gym_logged_in", "true");
                showApp();
            } else {
                errorDiv.style.display = "block";
            }
        }

        function handleLogout() {
            localStorage.removeItem("gym_logged_in");
            document.getElementById("app-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "flex";
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
        }

        function showApp() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-screen").style.display = "block";
        }

        function loadDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const today = new Date().toLocaleDateString('es-ES', options);
            document.getElementById("current-date").innerText = today;
            
            // Simulación de datos dinámicos según el día
            document.getElementById("today-routine").innerText = "Pecho + Tríceps: Press banca (4x8), Aperturas (3x12), Fondos en paralelas (3 al fallo).";
            document.getElementById("today-meal").innerText = "Comida: Arroz con pechuga de pollo y aguacate.\nCena: Salmón al horno con verduras salteadas.";
        }

        function toggleCreatine() {
            const checkbox = document.getElementById("creatine-check");
            const statusText = document.getElementById("creatine-status-text");
            if (checkbox.checked) {
                statusText.innerText = "¡Tomada!";
                statusText.style.color = "var(--success-color)";
            } else {
                statusText.innerText = "Pendiente";
                statusText.style.color = "var(--text-secondary)";
            }
        }

        function sendDataToN8n() {
            const text = document.getElementById("ai-input").value;
            if(!text) {
                alert("Escribe algo primero.");
                return;
            }
            alert("Texto listo para enviar a n8n en cuanto conectemos el Webhook:\n\n" + text);
        }

        // Registro del Service Worker para PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
            .then(() => console.log("Service Worker registrado con éxito."));
        }
    </script>
</body>
</html>
